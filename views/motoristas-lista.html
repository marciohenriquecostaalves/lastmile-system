<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Motoristas - Last Mile</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .barra-filtros { display:flex; gap:12px; margin-bottom:16px; align-items:flex-end; }
  .barra-filtros > div { flex: 1; max-width: 320px; }
  .barra-filtros label { margin-top: 0; }
  .contador-resultados { color: var(--ink-soft); font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <main class="main">
    <div class="page-header">
      <h1 class="page-title">Motoristas</h1>
      <p class="page-subtitle">Cadastro e acompanhamento da frota</p>
    </div>

    <div id="aviso-leitura" class="aviso oculto">Seu papel tem acesso de visualizacao (ou nao esta vinculado a uma filial). Cadastro esta desabilitado.</div>

    <div class="card oculto" id="form-novo-motorista" style="max-width:480px; margin-bottom:28px;">
      <h3>Novo motorista</h3>
      <form onsubmit="criarMotorista(event)">
        <label>Nome</label>
        <input required id="m-nome">
        <label>Telefone</label>
        <input required id="m-telefone">
        <label>Veiculo</label>
        <input id="m-veiculo" placeholder="Moto, Carro, Van...">
        <div style="margin-top:16px;"><button type="submit">Cadastrar motorista</button></div>
      </form>
      <div id="msg-motorista" class="mensagem"></div>
    </div>

    <div class="barra-filtros">
      <div>
        <label>Buscar</label>
        <input id="filtro-busca" placeholder="Nome ou telefone..." oninput="aplicarFiltros()">
      </div>
    </div>
    <div class="contador-resultados" id="contador-resultados"></div>

    <table>
      <thead><tr><th>Nome</th><th>Telefone</th><th>Veiculo</th><th>Link da rota</th></tr></thead>
      <tbody id="tabela-motoristas"></tbody>
    </table>
  </main>
</div>
<script src="/assets/nav.js"></script>
<script>
let motoristasCarregados = [];

document.addEventListener('sessaoCarregada', () => {
  document.getElementById('form-novo-motorista').classList.toggle('oculto', !window.podeOperar);
  document.getElementById('aviso-leitura').classList.toggle('oculto', window.podeOperar);
  carregarMotoristas();
});

async function carregarMotoristas() {
  const motoristas = await (await fetch('/drivers')).json();
  motoristasCarregados = motoristas;
  aplicarFiltros();
}

function aplicarFiltros() {
  const busca = document.getElementById('filtro-busca').value.toLowerCase().trim();
  const filtrados = motoristasCarregados.filter(m =>
    !busca || m.nome.toLowerCase().includes(busca) || m.telefone.includes(busca)
  );

  document.getElementById('contador-resultados').textContent =
    `${filtrados.length} de ${motoristasCarregados.length} motorista(s)`;

  document.getElementById('tabela-motoristas').innerHTML = filtrados.map(m => `
    <tr>
      <td>${m.nome}</td>
      <td>${m.telefone}</td>
      <td>${m.veiculo || '-'}</td>
      <td><a href="/motorista/${m.id}" target="_blank" class="mono" style="color:var(--accent);">/motorista/${m.id.slice(0,8)}...</a></td>
    </tr>
  `).join('') || '<tr><td colspan="4" class="page-subtitle">Nenhum motorista encontrado.</td></tr>';
}

async function criarMotorista(event) {
  event.preventDefault();
  const msg = document.getElementById('msg-motorista');
  msg.textContent = 'Enviando...';
  msg.className = 'mensagem';

  const corpo = {
    nome: document.getElementById('m-nome').value,
    telefone: document.getElementById('m-telefone').value,
    veiculo: document.getElementById('m-veiculo').value || undefined,
  };

  const resposta = await fetch('/drivers', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo),
  });
  const dados = await resposta.json();

  if (resposta.ok) {
    msg.textContent = 'Motorista cadastrado: ' + dados.nome;
    msg.className = 'mensagem sucesso';
    event.target.reset();
    carregarMotoristas();
  } else {
    msg.textContent = 'Erro: ' + (dados.detalhes ? dados.detalhes.map(d => d.mensagem).join(', ') : dados.erro);
    msg.className = 'mensagem erro';
  }
}
</script>
</body>
</html>
