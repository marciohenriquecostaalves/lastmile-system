<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Inicio - Last Mile</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .grafico-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-top: 28px; }
  .grafico-card h3 { font-family: var(--font-display); font-size: 15px; margin: 0 0 16px; }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <main class="main">
    <div class="page-header">
      <h1 class="page-title">Visao geral</h1>
      <p class="page-subtitle" id="subtitulo">Carregando...</p>
    </div>
    <div id="conteudo"></div>
    <div class="grafico-card">
      <h3 id="titulo-grafico">Pedidos por status</h3>
      <canvas id="grafico-status" height="90"></canvas>
    </div>
  </main>
</div>
<script src="/assets/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
document.addEventListener('sessaoCarregada', async (e) => {
  const sessao = e.detail;
  const visaoGlobal = ['gerente', 'torre_controle'].includes(sessao.papel);

  if (visaoGlobal) {
    document.getElementById('subtitulo').textContent = 'Comparativo entre todas as filiais';
    const filiais = await (await fetch('/api/filiais')).json();

    if (filiais.length === 0) {
      document.getElementById('conteudo').innerHTML = '<p class="page-subtitle">Nenhuma filial cadastrada ainda.</p>';
      return;
    }

    const resumos = await Promise.all(
      filiais.map(async (f) => ({
        filial: f,
        resumo: await (await fetch(`/api/filiais/${f.id}/resumo`)).json(),
      }))
    );

    document.getElementById('conteudo').innerHTML = `
      <div class="grid grid-3">
        ${resumos.map(({ filial, resumo }) => `
          <div class="card">
            <h3>${filial.nome}</h3>
            <p class="page-subtitle" style="margin-top:-10px; margin-bottom:14px;">${filial.cidade || ''}</p>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <div><span class="stat-label">Pedidos totais</span><div class="stat-value" style="font-size:20px;">${resumo.totalPedidos}</div></div>
              <div><span class="stat-label">Entregues</span><div class="stat-value" style="font-size:20px; color:var(--success);">${resumo.pedidosEntregues}</div></div>
              <div><span class="stat-label">Motoristas</span><div class="stat-value" style="font-size:20px;">${resumo.totalMotoristas}</div></div>
              <div><span class="stat-label">Rotas ativas</span><div class="stat-value" style="font-size:20px; color:var(--warning);">${resumo.rotasAtivas}</div></div>
            </div>
          </div>
        `).join('')}
      </div>
    `;

    document.getElementById('titulo-grafico').textContent = 'Pedidos entregues por filial';
    desenharGrafico(
      resumos.map(r => r.filial.nome),
      resumos.map(r => r.resumo.pedidosEntregues),
      resumos.map(r => r.resumo.totalPedidos - r.resumo.pedidosEntregues)
    );
  } else {
    document.getElementById('subtitulo').textContent = 'Resumo da sua operacao';

    const [pedidos, motoristas, rotas] = await Promise.all([
      fetch('/orders').then(r => r.json()),
      fetch('/drivers').then(r => r.json()),
      fetch('/routes').then(r => r.json()),
    ]);

    const entregues = pedidos.filter(p => p.status === 'entregue').length;
    const emRota = pedidos.filter(p => p.status === 'em_rota').length;
    const recebidos = pedidos.filter(p => p.status === 'recebido').length;
    const rotasAtivas = rotas.filter(r => ['planejada', 'em_andamento'].includes(r.status)).length;

    document.getElementById('conteudo').innerHTML = `
      <div class="grid grid-3">
        <div class="stat-card"><div class="stat-label">Pedidos totais</div><div class="stat-value">${pedidos.length}</div></div>
        <div class="stat-card"><div class="stat-label">Entregues</div><div class="stat-value" style="color:var(--success);">${entregues}</div></div>
        <div class="stat-card"><div class="stat-label">Motoristas</div><div class="stat-value">${motoristas.length}</div></div>
        <div class="stat-card"><div class="stat-label">Rotas ativas</div><div class="stat-value" style="color:var(--warning);">${rotasAtivas}</div></div>
      </div>
    `;

    document.getElementById('titulo-grafico').textContent = 'Pedidos por status';
    desenharGraficoStatus(recebidos, emRota, entregues);
  }
});

function desenharGrafico(labels, entregues, pendentes) {
  new Chart(document.getElementById('grafico-status'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Entregues', data: entregues, backgroundColor: '#1F7A53', borderRadius: 4 },
        { label: 'Pendentes', data: pendentes, backgroundColor: '#E4E2DC', borderRadius: 4 },
      ],
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom', labels: { font: { family: 'IBM Plex Sans' } } } },
      scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } },
    },
  });
}

function desenharGraficoStatus(recebidos, emRota, entregues) {
  new Chart(document.getElementById('grafico-status'), {
    type: 'bar',
    data: {
      labels: ['Recebido', 'Em rota', 'Entregue'],
      datasets: [{
        data: [recebidos, emRota, entregues],
        backgroundColor: ['#2451B3', '#B7791F', '#1F7A53'],
        borderRadius: 4,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
    },
  });
}
</script>
</body>
</html>
