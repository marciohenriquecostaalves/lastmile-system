<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login - Last Mile</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  body { display:flex; align-items:center; justify-content:center; height:100vh; }
  .login-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:36px; width:300px; }
  .login-brand { font-family:var(--font-display); font-weight:700; font-size:19px; margin-bottom:4px; }
  .login-brand span { color:var(--accent); }
  .login-subtitle { color:var(--ink-soft); font-size:13px; margin-bottom:20px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">Last Mile <span>OS</span></div>
    <p class="login-subtitle">Entre com suas credenciais</p>
    <form id="form-login">
      <label>Email</label>
      <input required type="email" id="email">
      <label>Senha</label>
      <input required type="password" id="senha">
      <div style="margin-top:18px;"><button type="submit" style="width:100%;">Entrar</button></div>
    </form>
    <div id="erro" class="mensagem erro"></div>
  </div>
<script>
document.getElementById('form-login').addEventListener('submit', async (event) => {
  event.preventDefault();
  const erroDiv = document.getElementById('erro');
  erroDiv.textContent = '';

  const resposta = await fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('email').value,
      senha: document.getElementById('senha').value,
    }),
  });

  if (resposta.ok) {
    window.location.href = '/';
  } else {
    const dados = await resposta.json();
    erroDiv.textContent = dados.erro || 'Erro ao entrar';
  }
});
</script>
</body>
</html>
