<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Last Mile - Login</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#0f172a; color:#e2e8f0; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .card { background:#1e293b; padding:32px; border-radius:8px; width:280px; }
  h1 { color:#38bdf8; font-size:20px; margin-top:0; }
  label { display:block; font-size:12px; color:#94a3b8; margin-top:12px; }
  input { width:100%; padding:8px; margin-top:4px; border-radius:4px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; box-sizing:border-box; }
  button { margin-top:20px; width:100%; background:#0284c7; color:white; border:none; padding:10px; border-radius:6px; cursor:pointer; font-size:14px; }
  button:hover { background:#0369a1; }
  .erro { color:#f87171; font-size:13px; margin-top:12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Last Mile — Login</h1>
    <form id="form-login">
      <label>Usuario</label>
      <input required id="usuario">
      <label>Senha</label>
      <input required type="password" id="senha">
      <button type="submit">Entrar</button>
    </form>
    <div id="erro" class="erro"></div>
  </div>
<script>
document.getElementById('form-login').addEventListener('submit', async (event) => {
  event.preventDefault();
  const erroDiv = document.getElementById('erro');
  erroDiv.textContent = '';

  const resposta = await fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      usuario: document.getElementById('usuario').value,
      senha: document.getElementById('senha').value,
    }),
  });

  if (resposta.ok) {
    window.location.href = '/';
  } else {
    const dados = await resposta.json();
    erroDiv.textContent = dados.erro || 'Erro ao entrar';
  }
});
</script>
</body>
</html>
