<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Last Mile - Painel</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:24px; }
  h1 { color:#38bdf8; }
  h2 { margin-top:32px; border-bottom:1px solid #334155; padding-bottom:8px; }
  table { width:100%; border-collapse: collapse; margin-top:12px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid #1e293b; font-size:14px; }
  th { color:#94a3b8; text-transform:uppercase; font-size:12px; }
  .badge { padding:2px 8px; border-radius:12px; font-size:12px; }
  .badge.recebido { background:#334155; }
  .badge.em_rota { background:#854d0e; }
  .badge.entregue { background:#166534; }
  .badge.planejada { background:#334155; }
  .badge.em_andamento { background:#854d0e; }
  .badge.concluida { background:#166534; }
  button { background:#0284c7; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; }
  button:hover { background:#0369a1; }
  .painel-forms { display:flex; gap:24px; flex-wrap:wrap; margin-top:16px; }
  .card { background:#1e293b; padding:16px; border-radius:8px; min-width:280px; flex:1; }
  .card h3 { margin-top:0; color:#38bdf8; font-size:15px; }
  label { display:block; font-size:12px; color:#94a3b8; margin-top:8px; }
  input, select { width:100%; padding:6px; margin-top:2px; border-radius:4px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; box-sizing:border-box; }
  .card button { margin-top:12px; width:100%; }
  .mensagem { margin-top:8px; font-size:13px; }
  .mensagem.sucesso { color:#4ade80; }
  .mensagem.erro { color:#f87171; }
</style>
</head>
<body>
  <h1>Last Mile — Painel Operacional</h1>
  <button onclick="carregarTudo()">Atualizar</button>

  <div class="painel-forms">
    <div class="card">
      <h3>Novo Pedido</h3>
      <form onsubmit="criarPedido(event)">
        <label>Nome do destinatario</label>
        <input required id="p-nome">
        <label>Telefone</label>
        <input required id="p-telefone">
        <label>Endereco de coleta</label>
        <input required id="p-coleta">
        <label>Endereco de entrega</label>
        <input required id="p-entrega">
        <label>Janela de entrega</label>
        <input required id="p-janela" placeholder="hoje ate 18h">
        <button type="submit">Criar pedido</button>
      </form>
      <div id="msg-pedido" class="mensagem"></div>
    </div>

    <div class="card">
      <h3>Novo Motorista</h3>
      <form onsubmit="criarMotorista(event)">
        <label>Nome</label>
        <input required id="m-nome">
        <label>Telefone</label>
        <input required id="m-telefone">
        <label>Veiculo</label>
        <input id="m-veiculo" placeholder="Moto, Carro, Van...">
        <button type="submit">Cadastrar motorista</button>
      </form>
      <div id="msg-motorista" class="mensagem"></div>
    </div>

    <div class="card">
      <h3>Gerar Rota</h3>
      <form onsubmit="gerarRota(event)">
        <label>Motorista</label>
        <select id="r-motorista">
          <option value="">Sem motorista definido</option>
        </select>
        <button type="submit">Gerar rota com pedidos pendentes</button>
      </form>
      <div id="msg-rota" class="mensagem"></div>
    </div>
  </div>

  <h2>Pedidos</h2>
  <table>
    <thead><tr><th>Rastreio</th><th>Destinatario</th><th>Endereco</th><th>Status</th></tr></thead>
    <tbody id="tabela-pedidos"></tbody>
  </table>

  <h2>Rotas</h2>
  <table>
    <thead><tr><th>ID</th><th>Motorista</th><th>Paradas</th><th>Distancia (km)</th><th>Status</th></tr></thead>
    <tbody id="tabela-rotas"></tbody>
  </table>

  <h2>Motoristas</h2>
  <table>
    <thead><tr><th>Nome</th><th>Telefone</th><th>Veiculo</th></tr></thead>
    <tbody id="tabela-motoristas"></tbody>
  </table>

<script>
async function carregarPedidos() {
  const resposta = await fetch('/orders');
  const pedidos = await resposta.json();
  const corpo = document.getElementById('tabela-pedidos');
  corpo.innerHTML = pedidos.map(p => `
    <tr>
      <td>${p.codigoRastreio}</td>
      <td>${p.destinatario.nome}</td>
      <td>${p.enderecoEntrega}</td>
      <td><span class="badge ${p.status}">${p.status}</span></td>
    </tr>
  `).join('');
}

async function carregarRotas() {
  const resposta = await fetch('/routes');
  const rotas = await resposta.json();
  const corpo = document.getElementById('tabela-rotas');
  corpo.innerHTML = rotas.map(r => `
    <tr>
      <td>${r.id.slice(0, 8)}</td>
      <td>${r.driverId ? r.driverId.slice(0, 8) : '-'}</td>
      <td>${r.paradas.length}</td>
      <td>${r.distanciaTotalKm}</td>
      <td><span class="badge ${r.status}">${r.status}</span></td>
    </tr>
  `).join('');
}

async function carregarMotoristas() {
  const resposta = await fetch('/drivers');
  const motoristas = await resposta.json();
  const corpo = document.getElementById('tabela-motoristas');
  corpo.innerHTML = motoristas.map(m => `
    <tr>
      <td>${m.nome}</td>
      <td>${m.telefone}</td>
      <td>${m.veiculo || '-'}</td>
    </tr>
  `).join('');

  const select = document.getElementById('r-motorista');
  select.innerHTML = '<option value="">Sem motorista definido</option>' +
    motoristas.map(m => `<option value="${m.id}">${m.nome}</option>`).join('');
}

function carregarTudo() {
  carregarPedidos();
  carregarRotas();
  carregarMotoristas();
}

async function criarPedido(event) {
  event.preventDefault();
  const msg = document.getElementById('msg-pedido');
  msg.textContent = 'Enviando...';
  msg.className = 'mensagem';

  const corpo = {
    destinatario: {
      nome: document.getElementById('p-nome').value,
      telefone: document.getElementById('p-telefone').value,
    },
    enderecoColeta: document.getElementById('p-coleta').value,
    enderecoEntrega: document.getElementById('p-entrega').value,
    janelaEntrega: document.getElementById('p-janela').value,
  };

  const resposta = await fetch('/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo),
  });
  const dados = await resposta.json();

  if (resposta.ok) {
    msg.textContent = 'Pedido criado: ' + dados.codigoRastreio;
    msg.className = 'mensagem sucesso';
    event.target.reset();
    carregarPedidos();
  } else {
    msg.textContent = 'Erro: ' + (dados.detalhes ? dados.detalhes.map(d => d.mensagem).join(', ') : dados.erro);
    msg.className = 'mensagem erro';
  }
}

async function criarMotorista(event) {
  event.preventDefault();
  const msg = document.getElementById('msg-motorista');
  msg.textContent = 'Enviando...';
  msg.className = 'mensagem';

  const corpo = {
    nome: document.getElementById('m-nome').value,
    telefone: document.getElementById('m-telefone').value,
    veiculo: document.getElementById('m-veiculo').value || undefined,
  };

  const resposta = await fetch('/drivers', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo),
  });
  const dados = await resposta.json();

  if (resposta.ok) {
    msg.textContent = 'Motorista cadastrado: ' + dados.nome;
    msg.className = 'mensagem sucesso';
    event.target.reset();
    carregarMotoristas();
  } else {
    msg.textContent = 'Erro: ' + (dados.detalhes ? dados.detalhes.map(d => d.mensagem).join(', ') : dados.erro);
    msg.className = 'mensagem erro';
  }
}

async function gerarRota(event) {
  event.preventDefault();
  const msg = document.getElementById('msg-rota');
  msg.textContent = 'Gerando rota (pode levar alguns segundos)...';
  msg.className = 'mensagem';

  const driverId = document.getElementById('r-motorista').value;
  const corpo = driverId ? { driverId } : {};

  const resposta = await fetch('/routes/gerar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo),
  });
  const dados = await resposta.json();

  if (resposta.ok) {
    msg.textContent = `Rota gerada com ${dados.paradas.length} parada(s), ${dados.distanciaTotalKm} km.`;
    msg.className = 'mensagem sucesso';
    carregarTudo();
  } else {
    msg.textContent = 'Erro: ' + (dados.erro || 'Nao foi possivel gerar a rota');
    msg.className = 'mensagem erro';
  }
}

carregarTudo();
</script>
</body>
</html>
